    localizacion: "cinco apariciones de «el último diciembre»"
    evidencia: "testimonios-propietario.md dice «el año pasado (2025)»; nunca «diciembre»"
    impacto: "Dato inventado en boca del propietario"
    correccion: "«en 2025», sin mes"
    criterio_cierre: "grep «diciembre» solo en la lista de evitar"
    historial:
      - {ronda: 4, estado: regresion, evidencia: "Introducido por la corrección de R2; R3 no lo detectó"}
      - {ronda: 5, estado: cerrado, evidencia: "R5: cerrado"}
  - id: PET-B-058
    severidad: P2
    estado: diferido
    origen: brief
    ronda_apertura: 6
    en_texto_modificado: false
    localizacion: "§8, imagen 2"
