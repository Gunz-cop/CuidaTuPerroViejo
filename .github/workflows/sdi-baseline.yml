name: SDI baseline

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirmá que querés crear la línea base de SDI"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: sdi-baseline-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Create SDI baseline
    runs-on: ubuntu-latest

    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'yes' }}
        run: |
          echo "La ejecución fue cancelada: elegí confirm=yes para crear la línea base."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore previous SDI state
        uses: actions/cache/restore@v4
        with:
          path: .sdi
          key: sdi-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            sdi-state-${{ github.ref_name }}-

      - name: Build static output without the legacy postbuild
        run: npm run astro -- build

      - name: Verify SDI source files
        run: |
          test -f dist/index.html
          test -f dist/sitemap-0.xml

      - name: Create baseline
        run: node node_modules/sdi-cli/dist/cli.js baseline --confirm --config sdi.config.mjs

      - name: Show baseline report
        run: cat .sdi/last-run.json

      - name: Save SDI state for future runs
        if: ${{ success() && hashFiles('.sdi/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .sdi
          key: sdi-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload baseline evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: sdi-baseline-${{ github.run_id }}
          path: |
            .sdi/state.json
            .sdi/last-run.json
          if-no-files-found: error
          retention-days: 30
